<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Lernapp</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#3D4BB5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #3D4BB5;
  --accent-light: #EEF0FB;
  --green: #2E9E6B;
  --green-light: #E8F7F1;
  --red: #D94F4F;
  --red-light: #FDEAEA;
  --text: #1A1D2E;
  --text2: #4A4F6A;
  --text3: #9099B5;
  --surface: #FFFFFF;
  --surface2: #F7F8FA;
  --border: #E8EAF2;
  --border2: #D0D4E8;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--surface2);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

/* ===== レイアウト ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh; /* dynamic viewport height (iOS対応) */
}

/* ===== ヘッダー ===== */
.app-header {
  background: var(--accent);
  color: #fff;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
.app-header p { font-size: 11px; opacity: 0.75; }
.header-stats { display: flex; gap: 14px; }
.hstat { text-align: center; }
.hstat-num { font-size: 16px; font-weight: 700; }
.hstat-lbl { font-size: 9px; opacity: 0.75; }

/* ===== メインコンテンツ ===== */
.app-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px;
}

/* ===== ページ（タブ切り替え） ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== 下部タブナビ ===== */
.tab-nav {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 6px;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  color: var(--text3);
  transition: color 0.15s;
  border-top: 3px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--accent); border-top-color: var(--accent); background: var(--accent-light); }
.tab-icon { font-size: 20px; line-height: 1; }
.tab-label { font-size: 10px; font-weight: 500; }

/* ===== カード ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== フィルターバー ===== */
.filter-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
  margin-bottom: 14px;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ===== 単語問題 ===== */
.q-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.q-dir { font-size: 12px; color: var(--accent); font-weight: 500; margin-bottom: 6px; }
.q-text {
  font-size: 28px;
  font-family: 'DM Serif Display', serif;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.3;
  min-height: 60px;
}
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.opt-btn {
  width: 100%;
  padding: 16px 12px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
  min-height: 56px;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.opt-btn:active:not(:disabled) { background: var(--accent-light); border-color: var(--accent); }
.opt-btn.correct { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }
.opt-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }
.opt-btn:disabled { cursor: default; }

/* ===== フィードバック ===== */
.feedback-box {
  display: none;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 10px;
}
.feedback-box.correct { background: var(--green-light); color: var(--green); }
.feedback-box.wrong { background: var(--red-light); color: var(--red); }

/* ===== ボタン ===== */
.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn-primary {
  flex: 1;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  min-height: 50px;
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary {
  flex: 1;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  min-height: 50px;
  -webkit-tap-highlight-color: transparent;
}
.btn-review {
  flex: 1;
  padding: 11px 10px;
  border-radius: var(--radius);
  border: 1.5px solid #E8A838;
  background: #FFFBF0;
  color: #9A6A00;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-review:disabled { opacity: 0.4; cursor: default; }
.btn-review.active-review { background: #E8A838; color: #fff; border-color: #C88A00; }

/* ===== 文法問題 ===== */
.grammar-sentence {
  font-size: 20px;
  color: var(--text);
  font-family: 'DM Serif Display', serif;
  margin-bottom: 16px;
  line-height: 1.5;
  min-height: 50px;
}
.blank-span {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2.5px solid var(--accent);
  margin: 0 2px;
}
.grammar-hint {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 12px;
  line-height: 1.5;
}
.grammar-input {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  font-size: 16px; /* iOSズーム防止 */
  font-family: inherit;
  color: var(--text);
  background: var(--surface2);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.15s;
}
.grammar-input:focus { border-color: var(--accent); background: #fff; }
.grammar-input:disabled { opacity: 0.6; }

/* ===== カテゴリバッジ ===== */
.cat-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 10px;
}
.badge-L1{background:#FFF3E0;color:#E65100}
.badge-L2{background:#E8F5E9;color:#2E7D32}
.badge-L3{background:#E3F2FD;color:#1565C0}
.badge-L4{background:#F3E5F5;color:#6A1B9A}
.badge-L5{background:#FCE4EC;color:#880E4F}
.badge-L6{background:#E0F7FA;color:#006064}
.badge-L7{background:#FFF8E1;color:#F57F17}
.badge-L8{background:#E8EAF6;color:#283593}
.badge-L9{background:#F1F8E9;color:#33691E}
.badge-L10{background:#FBE9E7;color:#BF360C}
.badge-L11{background:#E0F2F1;color:#004D40}
.badge-L12{background:#EDE7F6;color:#4527A0}
.badge-L13{background:#E1F5FE;color:#01579B}
.badge-L14{background:#EFEBE9;color:#3E2723}
.badge-GR{background:#F5F5F5;color:#424242}

/* ===== 方向切替トグル ===== */
.dir-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px;
  margin-bottom: 16px;
  gap: 2px;
}
.dir-toggle-btn {
  flex: 1;
  padding: 8px 10px;
  border-radius: 99px;
  border: none;
  background: none;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  color: var(--text3);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.dir-toggle-btn.active { background: var(--accent); color: #fff; }

/* ===== ダッシュボード ===== */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.dash-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
  box-shadow: var(--shadow);
}
.dash-card:active { transform: scale(0.97); }
.dash-card-icon { font-size: 28px; margin-bottom: 8px; }
.dash-card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.dash-card-desc { font-size: 11px; color: var(--text3); line-height: 1.4; }
.dash-card-count { font-size: 11px; color: var(--accent); font-weight: 500; margin-top: 6px; }

.streak-card {
  background: linear-gradient(135deg, var(--accent) 0%, #5B6BD5 100%);
  border-radius: var(--radius-lg);
  padding: 18px;
  color: #fff;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.streak-emoji { font-size: 36px; }
.streak-info h3 { font-size: 16px; font-weight: 700; }
.streak-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

/* ===== 統計バー ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 8px;
  text-align: center;
}
.stat-num { font-size: 20px; font-weight: 700; color: var(--text); }
.stat-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* ===== 進捗バー ===== */
.progress-wrap { margin-bottom: 14px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }

/* ===== ライティング ===== */
.topic-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.topic-btn {
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  -webkit-tap-highlight-color: transparent;
}
.topic-btn.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.writing-area {
  width: 100%;
  min-height: 140px;
  padding: 14px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface2);
  resize: vertical;
  outline: none;
  margin-bottom: 10px;
  line-height: 1.6;
}
.writing-area:focus { border-color: var(--accent); background: #fff; }
.ref-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 8px;
}
.ref-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  background: var(--surface);
  -webkit-tap-highlight-color: transparent;
}
.ref-body {
  display: none;
  padding: 12px 14px;
  background: var(--surface2);
  font-size: 12px;
  color: var(--text2);
  line-height: 1.9;
  white-space: pre-wrap;
  border-top: 1px solid var(--border);
}
.ref-item.open .ref-body { display: block; }
.ref-chevron { font-size: 11px; color: var(--text3); transition: transform 0.2s; }
.ref-item.open .ref-chevron { transform: rotate(180deg); }

/* ===== AI フィードバック ===== */
.ai-result {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text2);
  white-space: pre-wrap;
  margin-top: 10px;
}
</style>
</head>
<body>
<div class="app">

  <!-- ヘッダー -->
  <header class="app-header">
    <div>
      <h1>🇩🇪 Deutsch Lernapp</h1>
      <p>Schritte plus neu 4</p>
    </div>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-num" id="m-correct">0</div><div class="hstat-lbl">正解</div></div>
      <div class="hstat"><div class="hstat-num" id="m-total">0</div><div class="hstat-lbl">合計</div></div>
      <div class="hstat"><div class="hstat-num" id="m-pct">0%</div><div class="hstat-lbl">正答率</div></div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="app-body">

    <!-- ===== ホームページ ===== -->
    <div class="page active" id="page-home">
      <div class="streak-card">
        <div class="streak-emoji">🔥</div>
        <div class="streak-info">
          <h3 id="m-streak-text">今日も練習しよう！</h3>
          <p id="m-streak-sub">Viel Erfolg!</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-item"><div class="stat-num" id="m-s-correct">0</div><div class="stat-lbl">正解数</div></div>
        <div class="stat-item"><div class="stat-num" id="m-s-total">0</div><div class="stat-lbl">合計問題</div></div>
        <div class="stat-item"><div class="stat-num" id="m-s-streak">0</div><div class="stat-lbl">連続日数</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>正答率</span><span id="m-prog-pct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="m-prog-fill" style="width:0%"></div></div>
      </div>
      <div class="dash-grid">
        <div class="dash-card" onclick="goTab('vocab')">
          <div class="dash-card-icon">📖</div>
          <div class="dash-card-title">単語練習</div>
          <div class="dash-card-desc">4択クイズで語彙を鍛える</div>
          <div class="dash-card-count" id="m-vocab-count"></div>
        </div>
        <div class="dash-card" onclick="goTab('grammar')">
          <div class="dash-card-icon">✏️</div>
          <div class="dash-card-title">文法穴埋め</div>
          <div class="dash-card-desc">空欄を埋めて文法を習得</div>
          <div class="dash-card-count" id="m-grammar-count"></div>
        </div>
        <div class="dash-card" onclick="goTab('writing')">
          <div class="dash-card-icon">📝</div>
          <div class="dash-card-title">ライティング</div>
          <div class="dash-card-desc">自由作文で表現力UP</div>
        </div>
        <div class="dash-card" onclick="goTab('ref')">
          <div class="dash-card-icon">📚</div>
          <div class="dash-card-title">文法参照</div>
          <div class="dash-card-desc">文法ルールをいつでも確認</div>
        </div>
      </div>
    </div>

    <!-- ===== 単語ページ ===== -->
    <div class="page" id="page-vocab">
      <div class="filter-bar" id="v-filter-bar"></div>
      <div class="card">
        <div class="dir-toggle">
          <button class="dir-toggle-btn active" id="v-btn-deja" onclick="setVDir('de-ja')">DE → JA</button>
          <button class="dir-toggle-btn" id="v-btn-jade" onclick="setVDir('ja-de')">JA → DE</button>
        </div>
        <div class="q-dir" id="v-dir">ドイツ語 → 日本語</div>
        <div class="q-text" id="v-q">読み込み中...</div>
        <div class="options-grid" id="v-opts"></div>
        <div class="feedback-box" id="v-fb"></div>
        <div class="btn-row">
          <button class="btn-secondary" id="v-back-btn" onclick="prevV()" style="display:none">← 前へ</button>
          <button class="btn-primary" onclick="nextV()">次の問題 →</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn-review" id="v-today-btn" onclick="reviewToday('vocab')">📝 今日の間違い (<span id="v-today-count">0</span>)</button>
          <button class="btn-review" id="v-last-btn" onclick="reviewLast('vocab')">🔁 前回の間違い (<span id="v-last-count">0</span>)</button>
        </div>
      </div>
    </div>

    <!-- ===== 文法ページ ===== -->
    <div class="page" id="page-grammar">
      <div class="filter-bar" id="g-filter-bar"></div>
      <div class="card">
        <div id="g-badge"></div>
        <div class="grammar-sentence" id="g-q"></div>
        <div class="grammar-hint" id="g-hint"></div>
        <input class="grammar-input" id="g-input" type="text" placeholder="答えを入力..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="feedback-box" id="g-fb"></div>
        <div class="btn-row">
          <button class="btn-secondary" id="g-back-btn" onclick="prevG()" style="display:none">← 前へ</button>
          <button class="btn-primary" onclick="checkG()">確認する</button>
          <button class="btn-secondary" onclick="nextG()">次へ →</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn-review" id="g-today-btn" onclick="reviewToday('grammar')">📝 今日の間違い (<span id="g-today-count">0</span>)</button>
          <button class="btn-review" id="g-last-btn" onclick="reviewLast('grammar')">🔁 前回の間違い (<span id="g-last-count">0</span>)</button>
        </div>
      </div>
    </div>

    <!-- ===== ライティングページ ===== -->
    <div class="page" id="page-writing">
      <div class="card">
        <div class="card-title">📝 トピックを選ぶ</div>
        <div class="topic-grid" id="w-topics"></div>
      </div>
      <div class="card" id="w-compose-area" style="display:none">
        <div class="card-title">✍️ 作文する</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px" id="w-ref-text"></div>
        <textarea class="writing-area" id="w-text" placeholder="ここにドイツ語で書いてください..."></textarea>
        <div class="btn-row">
          <button class="btn-primary" onclick="submitWriting()">AI添削する</button>
          <button class="btn-secondary" onclick="clearWriting()">クリア</button>
        </div>
        <div class="ai-result" id="w-result" style="display:none"></div>
      </div>
    </div>

    <!-- ===== 文法参照ページ ===== -->
    <div class="page" id="page-ref">
      <div class="card">
        <div class="card-title">📚 文法参照カード</div>
        <div id="ref-list"></div>
      </div>

const REFS = [
  {t:"Indefinitpronomen: ein/kein/welch-（L3）",b:"同じ名詞でも使う場面で形が変わる！\n\n【Nominativ（主語）】\n　男性: einer / keiner\n　女性: eine / keine\n　中性: eins / keins\n　複数: welche / keine\n\n【Akkusativ（目的語）】\n　男性: einen / keinen\n　女性: eine / keine\n　中性: eins / keins\n　複数: welche / keine\n\n例:\n　Ich brauche einen Löffel. — Hast du einen?\n　Wo ist die Tasse? — Ich sehe keine mehr.\n　Haben wir noch Eier? — Ja, wir haben noch welche.\n　Möchtest du ein Dessert? — Nein, ich möchte keins."},
  {t:"頻度副詞（Frequenzadverbien）（L3）",b:"100% immer（いつも）\n　　 meistens（たいてい）\n　　 oft（よく）\n　　 manchmal（時々）\n　　 selten（めったに〜ない）\n　　 fast nie（ほとんど〜ない）\n0%  nie（決して〜ない）\n\n例:\n　Ich esse immer Frühstück.（いつも朝食を食べる）\n　Ich gehe manchmal ins Restaurant.（時々レストランに行く）\n　Ich esse nie Fleisch.（決して肉を食べない）\n\n※ 頻度副詞は動詞の直後に置く（または文中間）"},
  {t:"Wechselpräpositionen: Wo? vs Wohin?（L2）",b:"同じ前置詞でも、意味によって格が変わる！\n\n【Wo?（位置・状態）→ Dativ】\n　Die Lampe hängt an der Decke.\n　Das Buch liegt auf dem Tisch.\n　Der Schlüssel steckt im Schloss.\n\n【Wohin?（方向・移動）→ Akkusativ】\n　Ich hänge die Lampe an die Decke.\n　Ich lege das Buch auf den Tisch.\n　Steck den Schlüssel in das Schloss.\n\n主なWechselpräpositionen:\nan / auf / hinter / in / neben / über / unter / vor / zwischen"},
  {t:"stellen/legen/hängen/stecken vs stehen/liegen/hängen/stecken（L2）",b:"【動作動詞（Wohin? + Akkusativ）】\n　stellen → 縦に置く\n　legen → 横に置く\n　hängen → 掛ける\n　stecken → 差し込む\n\n【状態動詞（Wo? + Dativ）】\n　stehen → 立っている\n　liegen → 横になっている\n　hängen → 掛かっている\n　stecken → 刺さっている"},
  {t:"方向副詞（Direktionaladverbien）（L2）",b:"hinein（中へ・遠ざかる）/ heraus（外へ・近づく）\nhinauf（上へ・遠ざかる）/ herunter（下へ・近づく）\nhinaus（外へ・遠ざかる）/ herein（中へ・近づく）\n\n「hin-」= 話し手から遠ざかる方向\n「her-」= 話し手に近づく方向"},
  {t:"Perfekt: haben か sein か（L1）",b:"【sein + Partizip II】移動・場所の変化:\n　fahren → ist gefahren\n　ankommen → ist angekommen\n　umziehen → ist umgezogen\n　passieren → ist passiert\n\n【haben + Partizip II】それ以外:\n　kennenlernen → hat kennengelernt\n　vergessen → hat vergessen\n　verlieren → hat verloren\n　verpassen → hat verpasst"},
  {t:"Partizip II の作り方",b:"【規則動詞】ge- + 語幹 + -t\n　machen → gemacht / kaufen → gekauft\n\n【不規則動詞】ge- + 語幹変化 + -en\n　fahren → gefahren / essen → gegessen\n\n【非分離動詞（be-/ver-/er-/zer-）】ge-なし！\n　verstehen → verstanden / vergessen → vergessen\n　erklären → erklärt / bemerken → bemerkt\n\n【分離動詞】-ge-を間に挟む\n　aufstehen → aufgestanden / ankommen → angekommen"},
  {t:"接続詞: weil / deshalb（順接）",b:"weil（なぜなら）→ 副文・動詞末尾\n例: Ich bleibe zu Hause, weil es regnet.\n\ndeshalb（だから）→ 主文・動詞2位\n例: Es regnet. Deshalb bleibe ich zu Hause."},
  {t:"接続詞: trotzdem / obwohl（逆接）",b:"trotzdem → 主文・動詞2位\n例: Es regnet. Trotzdem gehe ich spazieren.\n\nobwohl → 副文・動詞末尾\n例: Obwohl es regnet, gehe ich spazieren.\n\n✅ Eva hat keine Zeit. Trotzdem kommt sie.（逆接）\n❌ Eva hat keine Zeit. Trotzdem kann sie nicht kommen.（→ Deshalb が正しい）"},

// ===== データ読み込み =====
// (VOCAB / GRAMMAR / TOPICS / REFS はこの後に挿入)

// ===== 統計 =====
function loadStats() {
  try { return JSON.parse(localStorage.getItem('dl_stats') || '{"correct":0,"total":0,"streak":0,"lastDate":""}'); }
  catch(e) { return {correct:0,total:0,streak:0,lastDate:""}; }
}
function saveStats() { localStorage.setItem('dl_stats', JSON.stringify(stats)); }
function upStats() {
  document.getElementById('m-correct').textContent = stats.correct;
  document.getElementById('m-total').textContent   = stats.total;
  document.getElementById('m-s-correct').textContent = stats.correct;
  document.getElementById('m-s-total').textContent   = stats.total;
  const pct = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
  document.getElementById('m-pct').textContent = pct + '%';
  document.getElementById('m-prog-pct').textContent = pct + '%';
  document.getElementById('m-prog-fill').style.width = pct + '%';
  document.getElementById('m-s-streak').textContent = stats.streak;
  saveStats();
}

function checkStreak() {
  const today = new Date().toISOString().slice(0,10);
  if (stats.lastDate !== today) {
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    stats.streak = stats.lastDate === yesterday ? stats.streak + 1 : 1;
    stats.lastDate = today;
    saveStats();
  }
  const el = document.getElementById('m-streak-text');
  const sub = document.getElementById('m-streak-sub');
  if (stats.streak >= 7) { el.textContent = `🔥 ${stats.streak}日連続学習中！`; sub.textContent = 'すごい！続けてください！'; }
  else if (stats.streak >= 3) { el.textContent = `${stats.streak}日連続学習中！`; sub.textContent = 'いい調子です！'; }
  else { el.textContent = '今日も練習しよう！'; sub.textContent = 'Viel Erfolg!'; }
}

// ===== タブナビ =====
function goTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'vocab' && !vReady) { initVFilter(); nextV(); vReady = true; }
  if (tab === 'grammar' && !gReady) { initGFilter(); nextG(); gReady = true; }
  if (tab === 'writing' && !wReady) { initTopics(); wReady = true; }
  if (tab === 'ref' && !refReady) { initRef(); refReady = true; }
}

// ===== フィルター初期化 =====
const vCats = [
  {k:'all',l:'すべて'},{k:'L1',l:'L1'},{k:'L2',l:'L2'},{k:'L3',l:'L3'},
  {k:'L4',l:'L4'},{k:'L5',l:'L5'},{k:'L6',l:'L6'},{k:'L7',l:'L7'},
  {k:'L8',l:'L8'},{k:'L9',l:'L9'},{k:'L10',l:'L10'},{k:'L11',l:'L11'},
  {k:'L12',l:'L12'},{k:'L13',l:'L13'},{k:'L14',l:'L14'},
];
function initVFilter() {
  const bar = document.getElementById('v-filter-bar');
  vCats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (c.k === vCat ? ' active' : '');
    b.textContent = c.l;
    b.onclick = () => { vCat = c.k; usedV = []; vReviewMode = null; vReviewPool = []; nextV(); bar.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); updateReviewBtns(); };
    bar.appendChild(b);
  });
}

const gCatList = [
  {k:'all',l:'すべて'},{k:'L1',l:'L1'},{k:'L2',l:'L2'},{k:'L3',l:'L3'},
  {k:'L4',l:'L4'},{k:'L5',l:'L5'},{k:'L6',l:'L6'},{k:'L7',l:'L7'},
  {k:'L8',l:'L8'},{k:'L9',l:'L9'},{k:'L10',l:'L10'},{k:'L11',l:'L11'},
  {k:'L12',l:'L12'},{k:'L13',l:'L13'},{k:'L14',l:'L14'},{k:'GR',l:'総まとめ'},
];
function initGFilter() {
  const bar = document.getElementById('g-filter-bar');
  gCatList.forEach(c => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (c.k === gCat ? ' active' : '');
    b.textContent = c.l;
    b.onclick = () => { gCat = c.k; usedG = []; gReviewMode = null; gReviewPool = []; nextG(); bar.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); updateReviewBtns(); };
    bar.appendChild(b);
  });
}

// ===== 単語問題 =====
function getVPool() {
  if (vReviewMode) return vReviewPool;
  return vCat === 'all' ? VOCAB : VOCAB.filter(w => w.cat === vCat);
}

function setVDir(dir) {
  vm = dir;
  document.getElementById('v-btn-deja').classList.toggle('active', dir === 'de-ja');
  document.getElementById('v-btn-jade').classList.toggle('active', dir === 'ja-de');
  usedV = []; nextV();
}

function nextV() {
  if (vHistoryPos < vHistory.length - 1) vHistoryPos = vHistory.length - 1;
  const pool = getVPool();
  if (!pool.length) { document.getElementById('v-q').textContent = '間違えた問題がありません'; document.getElementById('v-opts').innerHTML = ''; return; }
  if (usedV.length >= pool.length) usedV = [];
  const avail = pool.filter((_, i) => !usedV.includes(i));
  const w = avail[Math.floor(Math.random() * avail.length)];
  usedV.push(pool.indexOf(w));
  vHistory.push({w});
  vHistoryPos = vHistory.length - 1;
  renderV(w);
  updateBackBtn('v');
}

function prevV() {
  if (vHistoryPos <= 0) return;
  vHistoryPos--;
  renderV(vHistory[vHistoryPos].w);
  updateBackBtn('v');
}

function renderV(w) {
  document.getElementById('v-dir').textContent = vm === 'de-ja' ? 'ドイツ語 → 日本語' : '日本語 → ドイツ語';
  document.getElementById('v-q').textContent = vm === 'de-ja' ? w.de : w.ja;
  const correct = vm === 'de-ja' ? w.ja : w.de;
  const wrongs = (vm === 'de-ja' ? w.jaAlt : w.alt).slice(0, 3);
  const opts = shuffle([correct, ...wrongs]);
  const c = document.getElementById('v-opts');
  c.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = o;
    b.onclick = () => {
      document.querySelectorAll('#v-opts .opt-btn').forEach(x => { x.disabled = true; if (x.textContent === correct) x.classList.add('correct'); });
      const fb = document.getElementById('v-fb');
      fb.style.display = 'block'; stats.total++;
      const vi = VOCAB.indexOf(w);
      if (o === correct) { b.classList.add('correct'); fb.className='feedback-box correct'; fb.textContent='✓ 正解！'; stats.correct++; vTodayWrong = vTodayWrong.filter(i=>i!==vi); }
      else { b.classList.add('wrong'); fb.className='feedback-box wrong'; fb.textContent='✗ 不正解。正解: '+correct; if(vi>=0&&!vTodayWrong.includes(vi)) vTodayWrong.push(vi); }
      upStats(); updateReviewBtns();
    };
    c.appendChild(b);
  });
  document.getElementById('v-fb').style.display = 'none';
  document.getElementById('m-vocab-count').textContent = VOCAB.length + '語';
}

// ===== 文法問題 =====
function getGPool() {
  if (gReviewMode) return gReviewPool;
  return gCat === 'all' ? GRAMMAR : GRAMMAR.filter(q => q.cat === gCat);
}

function nextG() {
  if (gHistoryPos < gHistory.length - 1) gHistoryPos = gHistory.length - 1;
  const pool = getGPool();
  if (!pool.length) { document.getElementById('g-q').textContent = '間違えた問題がありません'; return; }
  if (usedG.length >= pool.length) usedG = [];
  const avail = pool.filter((_, i) => !usedG.includes(i));
  const q = avail[Math.floor(Math.random() * avail.length)];
  usedG.push(pool.indexOf(q));
  gHistory.push({q});
  gHistoryPos = gHistory.length - 1;
  renderG(q);
  updateBackBtn('g');
}

function prevG() {
  if (gHistoryPos <= 0) return;
  gHistoryPos--;
  renderG(gHistory[gHistoryPos].q);
  updateBackBtn('g');
}

function renderG(q) {
  const badges = {L1:'badge-L1',L2:'badge-L2',L3:'badge-L3',L4:'badge-L4',L5:'badge-L5',L6:'badge-L6',L7:'badge-L7',L8:'badge-L8',L9:'badge-L9',L10:'badge-L10',L11:'badge-L11',L12:'badge-L12',L13:'badge-L13',L14:'badge-L14',GR:'badge-GR'};
  const labels = {L1:'Lektion 1',L2:'Lektion 2',L3:'Lektion 3',L4:'Lektion 4',L5:'Lektion 5',L6:'Lektion 6',L7:'Lektion 7',L8:'Lektion 8',L9:'Lektion 9',L10:'Lektion 10',L11:'Lektion 11',L12:'Lektion 12',L13:'Lektion 13',L14:'Lektion 14',GR:'文法総まとめ'};
  document.getElementById('g-badge').innerHTML = `<span class="cat-badge ${badges[q.cat]||''}">${labels[q.cat]||''}</span>`;
  const parts = q.s.split('___');
  document.getElementById('g-q').innerHTML = parts[0] + '<span class="blank-span">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>' + (parts[1]||'');
  document.getElementById('g-hint').textContent = 'ヒント: ' + q.h;
  const inp = document.getElementById('g-input');
  inp.value = ''; inp.disabled = false;
  document.getElementById('g-fb').style.display = 'none';
  document.getElementById('m-grammar-count').textContent = GRAMMAR.length + '問';
}

function checkG() {
  const val = document.getElementById('g-input').value.trim();
  if (!val) return;
  const {q} = gHistory[gHistoryPos] || {};
  if (!q) return;
  const gi = GRAMMAR.indexOf(q);
  const fb = document.getElementById('g-fb');
  fb.style.display = 'block'; stats.total++;
  if (val.toLowerCase() === q.a.toLowerCase()) {
    fb.className='feedback-box correct'; fb.textContent='✓ 正解！　'+q.s.replace('___',q.a);
    stats.correct++; gTodayWrong = gTodayWrong.filter(i=>i!==gi);
  } else {
    fb.className='feedback-box wrong'; fb.textContent='✗ 不正解。正解: '+q.a+'　'+q.s.replace('___',q.a);
    if(gi>=0&&!gTodayWrong.includes(gi)) gTodayWrong.push(gi);
  }
  document.getElementById('g-input').disabled = true;
  upStats(); updateReviewBtns();
}

// Enterキーで確認
document.getElementById('g-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkG(); });

// ===== 間違い復習 =====
function loadWrong(key) { try { return JSON.parse(localStorage.getItem(key)||'[]'); } catch(e) { return []; } }
function saveWrong(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }

function updateReviewBtns() {
  const tv = vTodayWrong.length, lv = loadWrong('v_last_wrong').length;
  const tg = gTodayWrong.length, lg = loadWrong('g_last_wrong').length;
  document.getElementById('v-today-count').textContent = tv;
  document.getElementById('v-last-count').textContent  = lv;
  document.getElementById('g-today-count').textContent = tg;
  document.getElementById('g-last-count').textContent  = lg;
  document.getElementById('v-today-btn').disabled = tv === 0;
  document.getElementById('v-last-btn').disabled  = lv === 0;
  document.getElementById('g-today-btn').disabled = tg === 0;
  document.getElementById('g-last-btn').disabled  = lg === 0;
  ['v-today-btn','v-last-btn','g-today-btn','g-last-btn'].forEach(id => {
    const el = document.getElementById(id);
    const isActive = (id==='v-today-btn'&&vReviewMode==='today')||(id==='v-last-btn'&&vReviewMode==='last')||(id==='g-today-btn'&&gReviewMode==='today')||(id==='g-last-btn'&&gReviewMode==='last');
    el.classList.toggle('active-review', isActive);
  });
}

function reviewToday(mode) {
  if (mode === 'vocab') {
    if (!vTodayWrong.length) return;
    vReviewMode = vReviewMode==='today' ? null : 'today';
    vReviewPool = vReviewMode ? vTodayWrong.map(i=>VOCAB[i]).filter(Boolean) : [];
    usedV = []; nextV();
  } else {
    if (!gTodayWrong.length) return;
    gReviewMode = gReviewMode==='today' ? null : 'today';
    gReviewPool = gReviewMode ? gTodayWrong.map(i=>GRAMMAR[i]).filter(Boolean) : [];
    usedG = []; nextG();
  }
  updateReviewBtns();
}

function reviewLast(mode) {
  if (mode === 'vocab') {
    const last = loadWrong('v_last_wrong');
    if (!last.length) return;
    vReviewMode = vReviewMode==='last' ? null : 'last';
    vReviewPool = vReviewMode ? last.map(i=>VOCAB[i]).filter(Boolean) : [];
    usedV = []; nextV();
  } else {
    const last = loadWrong('g_last_wrong');
    if (!last.length) return;
    gReviewMode = gReviewMode==='last' ? null : 'last';
    gReviewPool = gReviewMode ? last.map(i=>GRAMMAR[i]).filter(Boolean) : [];
    usedG = []; nextG();
  }
  updateReviewBtns();
}

function updateBackBtn(mode) {
  const id = mode==='v' ? 'v-back-btn' : 'g-back-btn';
  const pos = mode==='v' ? vHistoryPos : gHistoryPos;
  document.getElementById(id).style.display = pos > 0 ? 'flex' : 'none';
}

// ===== ライティング =====
function initTopics() {
  const grid = document.getElementById('w-topics');
  grid.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'topic-btn';
    b.innerHTML = `<span>${t.l}</span><span>›</span>`;
    b.onclick = () => {
      document.querySelectorAll('.topic-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      selTopic = i;
      document.getElementById('w-ref-text').textContent = '参考: ' + t.ref;
      document.getElementById('w-compose-area').style.display = 'block';
      document.getElementById('w-result').style.display = 'none';
      document.getElementById('w-text').value = '';
    };
    grid.appendChild(b);
  });
}

async function submitWriting() {
  const text = document.getElementById('w-text').value.trim();
  if (!text || selTopic === null) return;
  const res = document.getElementById('w-result');
  res.style.display = 'block';
  res.textContent = '添削中...';
  const topic = TOPICS[selTopic];
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{role:'user',content:`あなたはドイツ語の先生です。以下の作文を添削してください。\n\nトピック: ${topic.l}\n参考文法: ${topic.ref}\n\n学習者の作文:\n${text}\n\n日本語で以下の順で回答してください:\n1. 全体評価（1〜2文）\n2. 良い点\n3. 修正箇所（あれば修正後の文も示す）\n4. 模範解答例（1〜2文）`}]
      })
    });
    const data = await r.json();
    res.textContent = data.content?.[0]?.text || 'エラーが発生しました。';
  } catch(e) {
    res.textContent = '※ AI添削にはVercel等のバックエンドが必要です。';
  }
}

function clearWriting() {
  document.getElementById('w-text').value = '';
  document.getElementById('w-result').style.display = 'none';
}

// ===== 文法参照 =====
function initRef() {
  const list = document.getElementById('ref-list');
  REFS.forEach(r => {
    const div = document.createElement('div');
    div.className = 'ref-item';
    div.innerHTML = `<div class="ref-head" onclick="this.parentElement.classList.toggle('open')"><span>${r.t}</span><span class="ref-chevron">▼</span></div><div class="ref-body">${r.b}</div>`;
    list.appendChild(div);
  });
}

// ===== ユーティリティ =====
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// ===== 初期化 =====
let stats = loadStats();
let vm = 'de-ja', vCat = 'all', gCat = 'all';
let usedV = [], usedG = [];
let vHistory = [], gHistory = [], vHistoryPos = -1, gHistoryPos = -1;
let vTodayWrong = [], gTodayWrong = [];
let vReviewMode = null, gReviewMode = null;
let vReviewPool = [], gReviewPool = [];
let selTopic = null;
let vReady = false, gReady = false, wReady = false, refReady = false;

upStats();
checkStreak();
updateReviewBtns();

window.addEventListener('beforeunload', () => {
  if (vTodayWrong.length) saveWrong('v_last_wrong', vTodayWrong);
  if (gTodayWrong.length) saveWrong('g_last_wrong', gTodayWrong);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
